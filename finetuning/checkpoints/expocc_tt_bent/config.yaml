seed: 42
use_wandb: true
wandb:
  project: superdec
  entity: eyluloykusen
run_name: expocc_tt_bent
dataset: shapenet
device: cuda
checkpoints:
  resume_from: checkpoints/expocc2.1/epoch_100.pt
  keep_epoch: false
superdec:
  extended: true
  extended_non_zero_init: true
  rotation6d: false
  decoder:
    n_queries: 16
    n_layers: 3
    n_heads: 1
    masked_attention: false
    swapped_attention: false
    dim_feedforward: 512
    deep_supervision: false
    pos_encoding_type: sinusoidal
  point_encoder:
    in_channels: 3
    out_channels: 128
    kernel_size: 3
    resolution: 32
    voxelization:
      normalize: true
      eps: 0
    l1:
      in_channels: 3
      out_channels: 64
      kernel_size: 3
      resolution: 32
      voxelization:
        normalize: true
        eps: 0
    l2:
      in_channels: 64
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: true
        eps: 0
    l3:
      in_channels: 128
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: true
        eps: 0
shapenet:
  path: data/ShapeNet
  categories: null
  normalize: true
  load_occupancy: true
  use_fps: false
trainer:
  save_path: checkpoints/expocc_tt_bent
  save_every_n_epochs: 25
  num_epochs: 100
  batch_size: 16
  num_workers: 8
  evaluate_every_n_epochs: 10
  augmentations: true
  occlusions: true
  rotation_limits:
  - 3.14159265
  - 3.14159265
  - 3.14159265
optimizer:
  lr: 0.0001
  weight_decay: 0
  betas:
  - 0.9
  - 0.999
  enable_scheduler: true
  only_heads: false
  all_but_heads: false
scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: ${optimizer.lr}
  epochs: ${trainer.num_epochs}
  steps_per_epoch: 149
loss:
  type: iou
  leaky_relu: 0.1
  truncation: 0.05
  w_sdf: 0.2
  w_iou: 0.2
  w_bbox: 0.0
  w_overlap: 5.0
  w_sps: 1.26
  w_ext: 0.02
visualization:
  res_primitives: 40
