seed: 42
use_wandb: true
wandb:
  project: superdec
  entity: eyluloykusen
run_name: expocc_tt_chamfer
dataset: shapenet
device: cuda
checkpoints:
  resume_from: checkpoints/exp_tt_chamfer/epoch_500.pt
  keep_epoch: false
superdec:
  extended: false
  extended_non_zero_init: true
  rotation6d: true
  decoder:
    n_queries: 16
    n_layers: 3
    n_heads: 1
    masked_attention: false
    swapped_attention: false
    dim_feedforward: 512
    deep_supervision: false
    pos_encoding_type: sinusoidal
  point_encoder:
    in_channels: 3
    out_channels: 128
    kernel_size: 3
    resolution: 32
    voxelization:
      normalize: true
      eps: 0
    l1:
      in_channels: 3
      out_channels: 64
      kernel_size: 3
      resolution: 32
      voxelization:
        normalize: true
        eps: 0
    l2:
      in_channels: 64
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: true
        eps: 0
    l3:
      in_channels: 128
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: true
        eps: 0
shapenet:
  path: data/ShapeNet
  categories: null
  normalize: false
  load_occupancy: true
  use_fps: false
  gt_train_path: data/output_npz/exp_tt_chamfer/iou_balanced/train.npz
  gt_val_path: data/output_npz/exp_tt_chamfer/iou_balanced/val.npz
  filter:
    metric: iou
    threshold: 0.0
    operator: '>='
trainer:
  save_path: checkpoints/expocc_tt_chamfer
  save_every_n_epochs: 50
  num_epochs: 500
  batch_size: 32
  num_workers: 8
  evaluate_every_n_epochs: 10
  augmentations: true
  occlusions: true
  rotation_limits:
  - 3.14159265
  - 3.14159265
  - 3.14159265
optimizer:
  lr: 0.0001
  weight_decay: 0
  betas:
  - 0.9
  - 0.999
  enable_scheduler: true
  only_heads: false
  all_but_heads: false
scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: ${optimizer.lr}
  epochs: ${trainer.num_epochs}
  steps_per_epoch: 52
loss:
  type: geom
  w_geometric: 1.0
  w_geometric_f: 1.0
  w_exist: 0.04
  w_iou: 0.0
  c_geometric: 1.0
  c_z_align: 0.0
  c_exist: 0.1
  n_samples_cost: 64
  n_samples: 512
visualization:
  res_primitives: 40
