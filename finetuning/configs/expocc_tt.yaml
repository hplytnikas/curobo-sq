# Student training: rigid SuperFlex on tabletop+GSO with full SO(3) and
# occlusion augmentations, supervised against pseudo-GT generated by Phase C.
# Forked from configs/expocc0.yaml.
#
# Resume target: checkpoints/exp_tt/epoch_1000.pt (the teacher from Phase B).
# The 4-D quat foundation rot_head is auto-deleted and re-initialized to 6-D
# by superdec.py:78-87 because rotation6d=true; expect a warning at load time.
#
# Loss: geom (Hungarian + Chamfer + rigid-Chamfer + existence BCE).
# w_iou=0 because GSO occupancy may be approximate; rely on geometric supervision.

seed: 42
use_wandb: true
wandb:
  project: superdec
  entity: eyluloykusen
run_name: expocc_tt_balanced
dataset: shapenet
device: cuda

checkpoints:
  resume_from: checkpoints/exp_tt/epoch_1000.pt
  keep_epoch: false

superdec:
  extended: false              # rigid student
  extended_non_zero_init: true # ignored when extended=false
  rotation6d: true             # continuity for full-SO(3) regression
  decoder:
    n_queries: 16
    n_layers: 3
    n_heads: 1
    masked_attention: false
    swapped_attention: false
    dim_feedforward: 512
    deep_supervision: False
    pos_encoding_type: sinusoidal
  point_encoder:
    in_channels: 3
    out_channels: 128
    kernel_size: 3
    resolution: 32
    voxelization:
      normalize: True
      eps: 0
    l1:
      in_channels: 3
      out_channels: 64
      kernel_size: 3
      resolution: 32
      voxelization:
        normalize: True
        eps: 0
    l2:
      in_channels: 64
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0
    l3:
      in_channels: 128
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0

shapenet:
  path: data/ShapeNet
  categories: null
  normalize: True
  load_occupancy: True            # batch IoU points still loaded (used by val IoU metric)
  use_fps: false                  # random subsampling so augmentation sees diverse views
  # NOTE: do NOT set geometric_samples here. LossGeometric (loss.type=geom)
  # samples GT points on-the-fly in CUDA from gt_scale/gt_shape; setting
  # geometric_samples would trigger redundant per-shape sampling in the
  # dataloader (only needed for loss.type=param_geom).
  # Pseudo-GT npz produced by Phase C (to_npz + batch_evaluate).
  # iou_balanced/ symlinks back to iou/*.npz but ships a per-category top-50%
  # filtered metrics CSV (instead of global IoU>=0.8) so bowls/mugs/gso
  # actually appear in training. The threshold is effectively zero because
  # the CSV is already pre-filtered.
  gt_train_path: data/output_npz/exp_tt/iou_balanced/train.npz
  gt_val_path:   data/output_npz/exp_tt/iou_balanced/val.npz
  filter:
    metric: iou
    threshold: 0.0
    operator: '>='

trainer:
  save_path: checkpoints
  save_every_n_epochs: 50
  num_epochs: 500
  batch_size: 32
  num_workers: 8
  evaluate_every_n_epochs: 10
  augmentations: True
  occlusions: True
  rotation_limits: [3.14159265, 3.14159265, 3.14159265]   # full SO(3) (X, Y, Z)

optimizer:
  lr: 1e-4
  weight_decay: 0
  betas: [0.9, 0.999]
  enable_scheduler: True
  only_heads: False
  all_but_heads: False

scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: ${optimizer.lr}
  epochs: ${trainer.num_epochs}
  steps_per_epoch: -1

loss:
  type: geom
  w_geometric: 1.0
  w_geometric_f: 1.0          # rigid Chamfer (paper §4.3 L_rigid). With rigid student this duplicates w_geometric, but harmless and matches paper recipe.
  w_exist: 0.04
  w_iou: 0.0                  # disable IoU loss term (avoids dependence on GSO occupancy)

  c_geometric: 1.0
  c_z_align: 0.0
  c_exist: 0.1

  n_samples_cost: 64
  n_samples: 512

visualization:
  res_primitives: 40
