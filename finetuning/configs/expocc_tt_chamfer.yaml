# Student training (Chamfer-teacher variant): rigid SuperFlex student on
# tabletop+GSO with full SO(3) and occlusion augmentations, supervised against
# pseudo-GT generated by the Chamfer teacher (exp_tt_chamfer.yaml).
#
# Identical to expocc_tt.yaml except:
#   - resume_from points to the Chamfer teacher
#   - gt_train/val_path point to pseudo-GT regenerated from that teacher
#   - run_name updated
#
# Robustness sources (unchanged from expocc_tt.yaml):
#   - occlusions: True            -> partial-view robustness
#   - rotation_limits: full SO(3) -> arbitrary tabletop pose robustness
# Pseudo-GT quality (decomposition + handle coverage) comes from the new teacher.

seed: 42
use_wandb: true
wandb:
  project: superdec
  entity: eyluloykusen
run_name: expocc_tt_chamfer
dataset: shapenet
device: cuda

checkpoints:
  resume_from: checkpoints/exp_tt_chamfer/epoch_500.pt
  keep_epoch: false

superdec:
  extended: false              # rigid student, cuRobo-compatible
  extended_non_zero_init: true # ignored when extended=false
  rotation6d: true             # continuity for full-SO(3) regression
  decoder:
    n_queries: 16
    n_layers: 3
    n_heads: 1
    masked_attention: false
    swapped_attention: false
    dim_feedforward: 512
    deep_supervision: False
    pos_encoding_type: sinusoidal
  point_encoder:
    in_channels: 3
    out_channels: 128
    kernel_size: 3
    resolution: 32
    voxelization:
      normalize: True
      eps: 0
    l1:
      in_channels: 3
      out_channels: 64
      kernel_size: 3
      resolution: 32
      voxelization:
        normalize: True
        eps: 0
    l2:
      in_channels: 64
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0
    l3:
      in_channels: 128
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0

shapenet:
  path: data/ShapeNet
  categories: null
  normalize: false              # match teacher + foundation
  load_occupancy: True          # batch IoU points still loaded for val IoU metric
  use_fps: false                # random subsampling for diverse augmented views
  # Pseudo-GT npz produced by Phase C from exp_tt_chamfer (regenerated).
  # iou_balanced/ keeps the per-category top-50% rebalancing so bowls/mugs/gso
  # appear in training. Threshold 0.0 because the CSV is pre-filtered.
  gt_train_path: data/output_npz/exp_tt_chamfer/iou_balanced/train.npz
  gt_val_path:   data/output_npz/exp_tt_chamfer/iou_balanced/val.npz
  filter:
    metric: iou
    threshold: 0.0
    operator: '>='

trainer:
  save_path: checkpoints
  save_every_n_epochs: 50
  num_epochs: 500
  batch_size: 32
  num_workers: 8
  evaluate_every_n_epochs: 10
  augmentations: True
  occlusions: True
  rotation_limits: [3.14159265, 3.14159265, 3.14159265]   # full SO(3)

optimizer:
  lr: 1e-4
  weight_decay: 0
  betas: [0.9, 0.999]
  enable_scheduler: True
  only_heads: False
  all_but_heads: False

scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: ${optimizer.lr}
  epochs: ${trainer.num_epochs}
  steps_per_epoch: -1

loss:
  type: geom
  w_geometric: 1.0
  w_geometric_f: 1.0          # rigid Chamfer term (paper §4.3 L_rigid)
  w_exist: 0.04
  w_iou: 0.0                  # disable IoU loss term (avoid GSO occupancy dependence)

  c_geometric: 1.0
  c_z_align: 0.0
  c_exist: 0.1

  n_samples_cost: 64
  n_samples: 512

visualization:
  res_primitives: 40
