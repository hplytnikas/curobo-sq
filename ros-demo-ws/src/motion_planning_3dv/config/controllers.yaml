controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_action_controller:
      type: position_controllers/GripperActionController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - fp3_joint1
      - fp3_joint2
      - fp3_joint3
      - fp3_joint4
      - fp3_joint5
      - fp3_joint6
      - fp3_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

gripper_trajectory_controller:
  ros__parameters:
    # CRITICAL: Only include the master joint here.
    # ros2_control handles the mirror joint (fp3_finger_joint2) automatically.
    joints:
      - fp3_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

gripper_action_controller:
  ros__parameters:
    # GripperActionController expects a singular 'joint' key, not a 'joints' list
    joint: fp3_finger_joint1

    # Tolerances for free-space movement
    goal_tolerance: 0.01
    action_monitor_rate: 20.0

    # Deadlock Prevention (Stall Detection)
    # If the finger velocity drops below 0.001 m/s for 0.5 seconds,
    # the controller assumes it has grasped an object and completes successfully.
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5

    # Note: Since your hardware interface only exposes position commands,
    # max_effort acts as a threshold/limit for the internal PID calculation.
    max_effort: 100.0
